name: apply PR 312 pass-count repair

on:
  push:
    branches: [claude/w2-flags-isa-batch]
    paths:
      - ".github/workflows/apply-pr312-test-metadata-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Update the stale pass-count assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/tests/test_passes_mem.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''TEST_CASE("PassManager: default_pipeline has 13 passes (x87 + peephole + flag-write-elim)") {
              auto pm = passes::default_pipeline();
              REQUIRE(pm.size() == 13u);
          }
          '''
          new = '''TEST_CASE("PassManager: default_pipeline has 14 passes (including inline-short-helpers)") {
              auto pm = passes::default_pipeline();
              REQUIRE(pm.size() == 14u);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("stale pass-count block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Commit the test repair and remove this workflow
        run: |
          git config user.name "prisma-ci"
          git config user.email "prisma-ci@users.noreply.github.com"
          git add core/tests/test_passes_mem.cpp
          git rm .github/workflows/apply-pr312-test-metadata-fixes.yml
          git commit -m "test(passes): refresh default pipeline count"
          git push origin HEAD:claude/w2-flags-isa-batch
