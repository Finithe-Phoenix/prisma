name: clang-format

# Verifies C/C++ sources touched by a change match .clang-format. This temporary
# diagnostic branch also runs an isolated, read-only ARM64 ADC/SBB inspection
# against PR #312; that job will be removed and this PR closed after diagnosis.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: clang-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format-17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-17

      - name: Check changed files and generate repair patch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base"...HEAD -- \
              'core/**/*.cpp' 'core/**/*.hpp' 'core/**/*.c' 'core/**/*.h' \
              | grep -v '/build/' | grep -v '/third_party/' || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C/C++ changes under core/ — nothing to check."
            exit 0
          fi

          printf '%s\n' "${files[@]}" > clang-format-files.txt
          printf '%s\0' "${files[@]}" | xargs -0 clang-format-17 -i
          git diff --binary -- "${files[@]}" > clang-format.patch

          if [ -s clang-format.patch ]; then
            echo "clang-format changes are required."
            echo "An exact repair patch will be uploaded as an artifact."
            git diff --stat -- "${files[@]}"
            exit 1
          fi

          echo "All changed C/C++ files are clang-format clean."

      - name: Upload clang-format repair patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-repair-patch
          if-no-files-found: ignore
          retention-days: 7
          path: |
            clang-format.patch
            clang-format-files.txt

  pr312-adc-arm64-diagnostic:
    name: pr312-adc-arm64-diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Instrument ADC/SBB test in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("product/shell/prisma-runtime/tests/exec_adc.rs")
          text = path.read_text(encoding="utf-8")
          old = '''fn translate(addr: u64, program: &[u8]) -> Vec<u8> {
    let mut t = Translator::new();
    let block = t
        .translate_fused_block(addr, program, 64)
        .expect("fused block translation");
'''
          new = '''fn translate(addr: u64, program: &[u8]) -> Vec<u8> {
    let mut t = Translator::new();
    let opt = t
        .optimize_fused_block(addr, program, 64)
        .expect("fused block optimization");
    eprintln!("PROGRAM={program:02x?}\\nOPTIMIZED_IR={:#?}", opt.func);
    let block = t
        .translate_fused_block(addr, program, 64)
        .expect("fused block translation");
    eprintln!("ARM64_CODE={:02x?}", block.code);
'''
          if text.count(old) != 1:
              raise SystemExit("translate helper not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Capture source locations
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -n -E 'fn value_reg|fn lower_binop|LoadCarry|ReadCarryOut|StoreCarry' \
              product/shell/prisma-backend/src/lowerer.rs
            grep -n -E 'Adc|Sbb|LoadCarry|ReadCarryOut|StoreCarry' \
              product/shell/prisma-decoder/src/decode.rs
          } > adc-source-locations.log || true

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run targeted ADC/SBB tests with full output
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-runtime --test exec_adc -- --nocapture \
            2>&1 | tee adc-test.log

      - name: Upload ADC/SBB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-adc-arm64-diagnostics
          retention-days: 2
          if-no-files-found: error
          path: |
            adc-test.log
            adc-source-locations.log
