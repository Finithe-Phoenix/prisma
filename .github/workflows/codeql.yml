name: codeql

# CodeQL security analysis for the core C++ engine. The manual build is split
# into configure and compile phases and retains logs on failure, so a red
# security check cannot hide an ordinary compiler problem.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  analyze:
    name: analyze (cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          config: |
            paths:
              - core/src
              - core/include
              - core/tests

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Configure traced build
        run: |
          set -o pipefail
          cmake -S core -B core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            2>&1 | tee codeql-configure.log

      - name: Build with CodeQL tracing
        run: |
          set -o pipefail
          cmake --build core/build 2>&1 | tee codeql-build.log

      - name: Preserve CodeQL build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            codeql-configure.log
            codeql-build.log

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
