name: ffi bridge (C++/Rust)

# Temporary, read-only diagnostics for PR #312. This branch never edits or
# pushes product source: it checks out the PR head, reproduces the two failing
# platforms, and retains complete compiler/test logs as artifacts.

on:
  pull_request:

concurrency:
  group: pr312-ffi-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr312-ffi-arm64-diagnostic:
    name: pr312-ffi-arm64-diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Configure C API library
        shell: bash
        run: |
          set -o pipefail
          cmake -S product/core -B product/core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DPRISMA_BUILD_TESTS=OFF \
            2>&1 | tee ffi-arm64-configure.log

      - name: Build C API library
        shell: bash
        run: |
          set -o pipefail
          cmake --build product/core/build --target prisma_core_c \
            2>&1 | tee ffi-arm64-build.log

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy

      - name: Run cross-language tests with full output
        shell: bash
        env:
          PRISMA_CORE_LIB_DIR: ${{ github.workspace }}/product/core/build
          LD_LIBRARY_PATH: ${{ github.workspace }}/product/core/build
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml --workspace \
            -- --nocapture 2>&1 | tee ffi-arm64-test.log

      - name: Upload ARM64 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-ffi-arm64-diagnostics
          retention-days: 2
          if-no-files-found: ignore
          path: |
            ffi-arm64-configure.log
            ffi-arm64-build.log
            ffi-arm64-test.log

  pr312-ffi-windows-diagnostic:
    name: pr312-ffi-windows-diagnostic
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Configure MSVC build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S product/core -B product/core/build -G "Visual Studio 17 2022" -A x64 2>&1 |
            Tee-Object -FilePath ffi-windows-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build core tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build product/core/build --config Debug --target prisma_core_tests 2>&1 |
            Tee-Object -FilePath ffi-windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CTest smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir product/core/build -C Debug --output-on-failure 2>&1 |
            Tee-Object -FilePath ffi-windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-ffi-windows-diagnostics
          retention-days: 2
          if-no-files-found: ignore
          path: |
            ffi-windows-configure.log
            ffi-windows-build.log
            ffi-windows-test.log
            product/core/build/Testing/Temporary/LastTest.log
