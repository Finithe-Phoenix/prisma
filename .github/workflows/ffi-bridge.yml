name: PR 312 ADC/SBB diagnostics

# Temporary read-only diagnostic for PR #312. It checks out the product branch,
# instruments only the runner workspace, and prints optimized IR + emitted code
# for the failing ARM64 ADC/SBB regression. It never commits or pushes product.

on:
  pull_request:

concurrency:
  group: pr312-adc-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr312-adc-arm64-diagnostic:
    name: pr312-adc-arm64-diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Instrument ADC/SBB test in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("product/shell/prisma-runtime/tests/exec_adc.rs")
          text = path.read_text(encoding="utf-8")
          old = '''fn translate(addr: u64, program: &[u8]) -> Vec<u8> {
    let mut t = Translator::new();
    let block = t
        .translate_fused_block(addr, program, 64)
        .expect("fused block translation");
'''
          new = '''fn translate(addr: u64, program: &[u8]) -> Vec<u8> {
    let mut t = Translator::new();
    let opt = t
        .optimize_fused_block(addr, program, 64)
        .expect("fused block optimization");
    eprintln!("PROGRAM={program:02x?}\\nOPTIMIZED_IR={:#?}", opt.func);
    let block = t
        .translate_fused_block(addr, program, 64)
        .expect("fused block translation");
    eprintln!("ARM64_CODE={:02x?}", block.code);
'''
          if text.count(old) != 1:
              raise SystemExit("translate helper not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Capture relevant backend source locations
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -n -E 'fn value_reg|fn lower_binop|LoadCarry|ReadCarryOut|StoreCarry' \
              product/shell/prisma-backend/src/lowerer.rs
            grep -n -E 'Adc|Sbb|LoadCarry|ReadCarryOut|StoreCarry' \
              product/shell/prisma-decoder/src/decode.rs
          } > adc-source-locations.log || true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal

      - name: Run targeted ADC/SBB tests with full output
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-runtime --test exec_adc -- --nocapture \
            2>&1 | tee adc-test.log

      - name: Upload ADC/SBB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-adc-arm64-diagnostics
          retention-days: 2
          if-no-files-found: error
          path: |
            adc-test.log
            adc-source-locations.log
