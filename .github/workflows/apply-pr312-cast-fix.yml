name: apply PR 312 cast repair

on:
  push:
    branches: [claude/w2-flags-isa-batch]
    paths:
      - ".github/workflows/apply-pr312-cast-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Replace the final old-style cast
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/src/runtime/syscall_handler.cpp")
          text = path.read_text(encoding="utf-8")
          old = '(unsigned long long)state->guest_pc'
          new = 'static_cast<unsigned long long>(state->guest_pc)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one old-style guest_pc cast, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Commit source repair and remove one-shot files
        run: |
          git config user.name "prisma-ci"
          git config user.email "prisma-ci@users.noreply.github.com"
          git add core/src/runtime/syscall_handler.cpp
          git rm .ci/pr312-object-diagnostic.txt
          git rm .github/workflows/apply-pr312-cast-fix.yml
          git commit -m "fix(runtime): use explicit guest PC logging cast"
          git push origin HEAD:claude/w2-flags-isa-batch
