name: diagnose PR 312 build

# Temporary workflow; remove immediately after the core build is green.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  concise-core-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Configure, build, and publish actionable diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rm -f diagnostic.txt comment.md

          if ! cmake -S core -B core/build-diagnose -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER=clang++-17 \
              > configure.log 2>&1; then
            {
              echo "=== CMake configure failure ==="
              tail -n 200 configure.log
            } > diagnostic.txt
          elif ! cmake --build core/build-diagnose > build.log 2>&1; then
            {
              echo "=== Filtered compiler diagnostics ==="
              grep -n -E \
                'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped' \
                build.log | head -n 240 || true
              echo "=== Tail for context ==="
              tail -n 120 build.log
            } > diagnostic.txt
          else
            echo "Core build succeeded; no diagnostic comment was required."
            exit 0
          fi

          {
            echo "### Temporary concise build diagnostics"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            cat diagnostic.txt
            echo '```'
            echo
            echo "This comment was generated by the temporary diagnostic workflow and will be removed from the branch after the fix."
          } > comment.md

          gh pr comment 312 --body-file comment.md
          cat diagnostic.txt
          exit 1
