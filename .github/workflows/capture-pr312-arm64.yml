name: capture PR 312 ARM64 diagnostic

on:
  push:
    branches: [claude/w2-flags-isa-batch]
    paths:
      - ".github/workflows/capture-pr312-arm64.yml"

permissions:
  contents: write

jobs:
  capture-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Capture ARM64 build or test failure
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci
          if ! cmake -S core -B core/build-arm64-capture -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER=clang++-17 \
              > configure.log 2>&1; then
            {
              echo "ARM64_CONFIGURE_FAILURE"
              tail -n 220 configure.log
            } > .ci/pr312-arm64-diagnostic.txt
          elif ! cmake --build core/build-arm64-capture \
              > build.log 2>&1; then
            {
              echo "ARM64_BUILD_FAILURE"
              grep -n -E \
                'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped' \
                build.log | head -n 240 || true
              echo "--- tail ---"
              tail -n 180 build.log
            } > .ci/pr312-arm64-diagnostic.txt
          elif ! ctest --test-dir core/build-arm64-capture \
              --output-on-failure > test.log 2>&1; then
            {
              echo "ARM64_TEST_FAILURE"
              grep -n -E \
                'FAILED|Failed|failure|Failure|Segmentation|SIG|timeout|Timeout|Exception|assertion|error:' \
                test.log | head -n 260 || true
              echo "--- tail ---"
              tail -n 300 test.log
            } > .ci/pr312-arm64-diagnostic.txt
          else
            echo "ARM64_BUILD_AND_TEST_SUCCESS" > .ci/pr312-arm64-diagnostic.txt
          fi

      - name: Publish result and remove one-shot workflow
        run: |
          git config user.name "prisma-ci"
          git config user.email "prisma-ci@users.noreply.github.com"
          git add .ci/pr312-arm64-diagnostic.txt
          git rm .github/workflows/capture-pr312-arm64.yml
          git commit -m "ci: capture PR 312 ARM64 diagnostic"
          git push origin HEAD:claude/w2-flags-isa-batch
