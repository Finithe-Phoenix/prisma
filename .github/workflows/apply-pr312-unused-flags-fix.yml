name: apply PR 312 unused clone flag repair

on:
  push:
    branches: [claude/w2-flags-isa-batch]
    paths:
      - ".github/workflows/apply-pr312-unused-flags-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Remove unused deferred clone constants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/src/runtime/syscall_handler.cpp")
          text = path.read_text(encoding="utf-8")
          lines = [
              "constexpr std::uint64_t kCloneFs = 0x00000200;\n",
              "constexpr std::uint64_t kCloneFiles = 0x00000400;\n",
              "constexpr std::uint64_t kCloneSighand = 0x00000800;\n",
              "constexpr std::uint64_t kCloneThread = 0x00010000;\n",
          ]
          for line in lines:
              count = text.count(line)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {line.strip()}, found {count}")
              text = text.replace(line, "")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit source repair and remove one-shot files
        run: |
          git config user.name "prisma-ci"
          git config user.email "prisma-ci@users.noreply.github.com"
          git add core/src/runtime/syscall_handler.cpp
          git rm .ci/pr312-arm64-diagnostic.txt
          git rm .github/workflows/apply-pr312-unused-flags-fix.yml
          git commit -m "fix(runtime): drop unused deferred clone flags"
          git push origin HEAD:claude/w2-flags-isa-batch
