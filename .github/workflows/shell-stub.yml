name: shell (Rust) — stub

# Rust shell validation plus a temporary read-only ARM64 diagnostic for PR #312.
# The diagnostic PR is never merged and only instruments its runner checkout.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: shell-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify shell/ scaffolding
        run: |
          set -euo pipefail
          test -f shell/README.md || { echo "shell/README.md missing"; exit 1; }
          if [ -f shell/Cargo.toml ]; then
            echo "shell/Cargo.toml detected — running real build"
            rustup toolchain install stable --profile minimal --component clippy --component rustfmt
            cargo fmt --manifest-path shell/Cargo.toml --all -- --check
            cargo clippy --manifest-path shell/Cargo.toml -- -D warnings
            cargo test --manifest-path shell/Cargo.toml
          else
            echo "shell/Cargo.toml not yet present (Fase 3 not started). Scaffolding check only."
          fi

  pr312-unary-arm64-diagnostic:
    name: pr312-unary-arm64-diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic controls
        uses: actions/checkout@v7
        with:
          path: diagnostic

      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Instrument product checkout only
        run: python3 diagnostic/tools/ci/instrument_pr312_unary.py product

      - name: Capture relevant source locations
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -n -E 'decode_group3|decode_group5|push_alu_flags|WriteFlags|StoreReg' \
              product/shell/prisma-decoder/src/decode.rs
            grep -n -E 'fn value_reg|WriteFlags|AluFlags|StoreReg' \
              product/shell/prisma-backend/src/lowerer.rs
          } > unary-source-locations.log || true

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run unary ALU tests with full output
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-runtime --test exec_unary_alu -- --nocapture \
            2>&1 | tee unary-test.log

      - name: Upload unary ALU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-unary-arm64-diagnostics
          retention-days: 2
          if-no-files-found: error
          path: |
            unary-test.log
            unary-source-locations.log
