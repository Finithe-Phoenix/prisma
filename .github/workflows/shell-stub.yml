name: shell (Rust) — stub

# Rust shell validation. This temporary diagnostic branch validates the PR #312
# ADC/SBB ordering fix and publishes only the already-proven Git blob. It will
# be closed without merging after the product commit is created by the Git API.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: shell-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify shell/ scaffolding
        run: |
          set -euo pipefail
          test -f shell/README.md || { echo "shell/README.md missing"; exit 1; }
          if [ -f shell/Cargo.toml ]; then
            echo "shell/Cargo.toml detected — running real build"
            rustup toolchain install stable --profile minimal --component clippy --component rustfmt
            cargo fmt --manifest-path shell/Cargo.toml --all -- --check
            cargo clippy --manifest-path shell/Cargo.toml -- -D warnings
            cargo test --manifest-path shell/Cargo.toml
          else
            echo "shell/Cargo.toml not yet present (Fase 3 not started). Scaffolding check only."
          fi

  pr312-adc-arm64-preview:
    name: pr312-adc-arm64-preview
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout preview controls
        uses: actions/checkout@v7
        with:
          path: diagnostic

      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Apply destination-store ordering fix in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/tools/ci/apply_pr312_adc_store_order.py product
          cd product
          git diff --check
          git diff --binary -- shell/prisma-decoder/src/decode.rs > ../adc-store-order.patch

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting of patched decoder
        run: cargo fmt --manifest-path product/shell/Cargo.toml --all -- --check

      - name: Run native ARM64 ADC/SBB regressions
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-runtime --test exec_adc -- --nocapture \
            2>&1 | tee adc-runtime-test.log

      - name: Run complete decoder crate tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-decoder 2>&1 | tee adc-decoder-test.log

      - name: Upload validated ADC/SBB source preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-adc-store-order-validated-source
          retention-days: 2
          if-no-files-found: error
          path: |
            product/shell/prisma-decoder/src/decode.rs
            adc-store-order.patch
            adc-runtime-test.log
            adc-decoder-test.log

  publish-pr312-adc-validated-blob:
    name: publish-pr312-adc-validated-blob
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_ARTIFACT_ID: "8578717175"
      EXPECTED_SHA256: "04cf8bb9e63f987724e3754700ebf3c43028424d82848a0f0b13e07a4adce3c3"
      EXPECTED_BLOB_SHA: "015451d7622686d26e211edb45b05fc7a78c6e4b"
    steps:
      - name: Download validated ADC/SBB artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATED_ARTIFACT_ID}/zip" \
            --output validated.zip
          unzip -q validated.zip -d validated

      - name: Verify bytes and publish unreachable Git blob
        shell: bash
        run: |
          set -euo pipefail
          source_file="validated/product/shell/prisma-decoder/src/decode.rs"
          actual_sha256="$(sha256sum "${source_file}" | cut -d' ' -f1)"
          test "${actual_sha256}" = "${EXPECTED_SHA256}"

          jq -Rs '{content: ., encoding: "utf-8"}' < "${source_file}" > blob-request.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @blob-request.json \
            --output blob-response.json

          blob_sha="$(jq -r '.sha // empty' blob-response.json)"
          test "${blob_sha}" = "${EXPECTED_BLOB_SHA}"
          printf '%s\n' "${blob_sha}" > validated-blob-sha.txt

      - name: Upload validated blob receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr312-adc-blob-receipt
          retention-days: 1
          if-no-files-found: error
          path: validated-blob-sha.txt
