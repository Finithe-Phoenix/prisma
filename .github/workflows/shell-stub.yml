name: shell (Rust) — stub

# Rust shell validation plus a temporary read-only ARM64 preview for PR #312.
# The diagnostic PR is never merged and only modifies its runner checkout.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: shell-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify shell/ scaffolding
        run: |
          set -euo pipefail
          test -f shell/README.md || { echo "shell/README.md missing"; exit 1; }
          if [ -f shell/Cargo.toml ]; then
            echo "shell/Cargo.toml detected — running real build"
            rustup toolchain install stable --profile minimal --component clippy --component rustfmt
            cargo fmt --manifest-path shell/Cargo.toml --all -- --check
            cargo clippy --manifest-path shell/Cargo.toml -- -D warnings
            cargo test --manifest-path shell/Cargo.toml
          else
            echo "shell/Cargo.toml not yet present (Fase 3 not started). Scaffolding check only."
          fi

  pr312-muldiv-arm64-preview:
    name: pr312-muldiv-arm64-preview
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout preview controls
        uses: actions/checkout@v7
        with:
          path: diagnostic

      - name: Checkout PR 312 product branch
        uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0
          path: product

      - name: Apply narrow DIV/IDIV lifetime fix in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 diagnostic/tools/ci/apply_pr312_narrow_div_order.py product
          cd product
          git diff --check
          git diff --binary -- shell/prisma-decoder/src/decode.rs > ../narrow-div-order.patch

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path product/shell/Cargo.toml --all -- --check

      - name: Run complete native ARM64 MUL/DIV regression file
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-runtime --test exec_muldiv -- --nocapture \
            2>&1 | tee muldiv-runtime-test.log

      - name: Run complete decoder crate tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path product/shell/Cargo.toml \
            -p prisma-decoder 2>&1 | tee muldiv-decoder-test.log

      - name: Upload validated narrow DIV/IDIV source preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-narrow-div-validated-source
          retention-days: 2
          if-no-files-found: error
          path: |
            product/shell/prisma-decoder/src/decode.rs
            narrow-div-order.patch
            muldiv-runtime-test.log
            muldiv-decoder-test.log
