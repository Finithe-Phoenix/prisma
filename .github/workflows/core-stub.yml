name: core (C++20) — stub

# Core CI is intentionally diagnostic-first: configure, build, and test are
# separate steps, and failure logs are retained as artifacts. This makes it
# clear whether a red run is a compiler failure, a test failure, or runner
# infrastructure instead of hiding all three inside one shell step.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-stub.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-stub.yml"

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  core-build:
    name: core-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify core scaffolding
        run: |
          set -euo pipefail
          test -f core/README.md || { echo "core/README.md missing"; exit 1; }
          test -f core/CMakeLists.txt || {
            echo "core/CMakeLists.txt not yet present (Fase 1 not started)."
            exit 0
          }

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Configure
        run: |
          cmake -S core -B core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            2>&1 | tee core-configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build core/build 2>&1 | tee core-build.log

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir core/build --output-on-failure \
            2>&1 | tee core-test.log

      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-x86_64-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            core-configure.log
            core-build.log
            core-test.log
            core/build/Testing/Temporary/LastTest.log

  # Same suite on a real ARM64 runner. This is where the e2e corpus actually
  # executes translated guest code; x86_64 keeps the fast portable coverage.
  core-build-arm64:
    name: core-build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Configure
        run: |
          cmake -S core -B core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            2>&1 | tee core-arm64-configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build core/build 2>&1 | tee core-arm64-build.log

      - name: Test JIT suite
        run: |
          set -o pipefail
          ctest --test-dir core/build --output-on-failure \
            2>&1 | tee core-arm64-test.log

      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-arm64-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            core-arm64-configure.log
            core-arm64-build.log
            core-arm64-test.log
            core/build/Testing/Temporary/LastTest.log

  # Temporary read-only validation used while stabilizing PR #312. It checks
  # out the product branch, applies the minimal source replacement in the
  # runner workspace, proves the exact ARM64 regression, and publishes the
  # validated file. It never commits or pushes source.
  pr312-widediv-preview:
    name: pr312-widediv-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 329
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Apply minimal unsigned WideDiv patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/src/backend/lowering.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''          WideDivWorkRegs work{};
          if (!allocate_temporary(work.rem) || !allocate_temporary(work.low) ||
              !allocate_temporary(work.divisor) || !allocate_temporary(work.mask) ||
              !allocate_temporary(work.bit) || !allocate_temporary(work.overflow)) {
            return {false, LowerError::OutOfScratchRegs, "WideDiv temporaries"};
          }

          emit_divisor_zero_sigfpe_guard(emitter_, divisor, options_.emit_ret_on_terminator);
          emitter_.mov_reg_reg(work.rem, high);
          emitter_.mov_reg_reg(work.low, low);
          emitter_.mov_reg_reg(work.divisor, divisor);
          if (op.is_signed) {
'''
          new = '''          WideDivWorkRegs work{};
          if (!allocate_temporary(work.rem) || !allocate_temporary(work.low) ||
              !allocate_temporary(work.mask) || !allocate_temporary(work.bit) ||
              !allocate_temporary(work.overflow)) {
            return {false, LowerError::OutOfScratchRegs, "WideDiv temporaries"};
          }
          if (op.is_signed) {
            if (!allocate_temporary(work.divisor)) {
              return {false, LowerError::OutOfScratchRegs,
                      "WideDiv signed divisor temporary"};
            }
          } else {
            // Unsigned division never mutates the divisor. Reuse its live
            // SSA register instead of consuming a sixth temporary.
            work.divisor = divisor;
          }

          emit_divisor_zero_sigfpe_guard(emitter_, divisor, options_.emit_ret_on_terminator);
          emitter_.mov_reg_reg(work.rem, high);
          emitter_.mov_reg_reg(work.low, low);
          if (op.is_signed) {
            emitter_.mov_reg_reg(work.divisor, divisor);
'''
          if text.count(old) != 1:
              raise SystemExit("WideDiv allocation block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff --binary -- core/src/backend/lowering.cpp > widediv.patch

      - name: Install ARM64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Configure and build core tests
        run: |
          cmake -S core -B core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-17
          cmake --build core/build --target prisma_core_tests

      - name: Run focused WideDiv regression
        run: |
          core/build/prisma_core_tests \
            "e2e: DIV r/m64 full-width dividend - quotient and remainder"

      - name: Upload validated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-widediv-validated-source
          retention-days: 1
          if-no-files-found: error
          path: |
            core/src/backend/lowering.cpp
            widediv.patch
