name: apply PR 312 compile repair

on:
  push:
    branches: [claude/w2-flags-isa-batch]
    paths:
      - "scripts/fix_pr312_compile.py"
      - ".github/workflows/apply-pr312-compile-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Apply assertion-based repair
        run: python3 scripts/fix_pr312_compile.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit repaired sources and remove one-shot machinery
        run: |
          git config user.name "prisma-ci"
          git config user.email "prisma-ci@users.noreply.github.com"
          git add \
            core/include/prisma/syscall_handler.hpp \
            core/src/runtime/dispatcher.cpp \
            core/src/runtime/syscall_handler.cpp
          git rm \
            scripts/fix_pr312_compile.py \
            .github/workflows/apply-pr312-compile-fix.yml
          git commit -m "fix(runtime): repair POSIX macro and warning collisions"
          git push origin HEAD:claude/w2-flags-isa-batch
