name: capture PR 312 diagnostic

on:
  push:
    branches: [claude/w2-flags-isa-batch]
    paths:
      - ".github/workflows/capture-pr312-diagnostic.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/w2-flags-isa-batch
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-17

      - name: Capture concise result
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci
          rm -f .ci/pr312-diagnostic.txt

          if ! cmake -S core -B core/build-capture -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER=clang++-17 \
              > configure.log 2>&1; then
            {
              echo "CMAKE_CONFIGURE_FAILURE"
              tail -n 240 configure.log
            } > .ci/pr312-diagnostic.txt
          elif ! cmake --build core/build-capture > build.log 2>&1; then
            {
              echo "CORE_BUILD_FAILURE"
              grep -n -E \
                'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped' \
                build.log | head -n 300 || true
              echo "--- tail ---"
              tail -n 180 build.log
            } > .ci/pr312-diagnostic.txt
          else
            echo "CORE_BUILD_SUCCESS" > .ci/pr312-diagnostic.txt
          fi

      - name: Publish result and remove one-shot workflow
        run: |
          git config user.name "prisma-ci"
          git config user.email "prisma-ci@users.noreply.github.com"
          git add .ci/pr312-diagnostic.txt
          git rm .github/workflows/capture-pr312-diagnostic.yml
          git commit -m "ci: capture PR 312 core diagnostic"
          git push origin HEAD:claude/w2-flags-isa-batch
